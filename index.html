<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="新本草：华农治愈图鉴——深秋限定「寻找专治大学生现代病的古方」。点击封面进入 180° VR 环幕。">
<title>新本草 · 华农治愈图鉴</title>
<link rel="preload" as="image" href="assets/bg.jpg">
<!--
  封面入口：点击画面进入 vr.html。
  替换封面时保持 assets/cover.jpg 文件名不变，建议 16:9 横图。
-->
<style>
  :root{--gold:#e8c98a;--paper:#f4ecdd}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#05080d;color:var(--paper);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    transition:opacity .32s ease;
  }
  .cover-bg{
    position:fixed;inset:-40px;z-index:0;
    background:#05080d url("assets/cover.jpg") center/cover no-repeat;
    filter:blur(28px) brightness(.55) saturate(1.05);
    transform:scale(1.06);
  }
  .cover-bg::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 40%,transparent 38%,rgba(0,0,0,.6) 100%);
  }
  .cover-link{
    position:fixed;inset:0;z-index:1;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;cursor:pointer;outline:none;
  }
  .cover-link img{
    display:block;width:auto;height:auto;max-width:100vw;max-height:100vh;
    opacity:0;transform:scale(1.015);
    transition:opacity .8s ease,transform 1.2s ease;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
  }
  body.ready .cover-link img{opacity:1;transform:scale(1)}
  .cover-link:focus-visible img{outline:2px solid var(--gold);outline-offset:4px}

  .enter-hint{
    position:fixed;left:50%;bottom:clamp(18px,4vh,46px);z-index:2;
    transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:10px;
    padding:11px 20px;border-radius:999px;
    border:1px solid rgba(232,201,138,.4);background:rgba(5,9,14,.62);
    backdrop-filter:blur(12px);text-decoration:none;white-space:nowrap;
    font-size:13px;letter-spacing:.18em;color:var(--paper);
    animation:breathe 3.2s ease-in-out infinite;
  }
  .enter-hint b{color:var(--gold);font-weight:600}
  .enter-hint::after{content:"→";color:var(--gold);transition:transform .25s}
  .enter-hint:hover::after{transform:translateX(4px)}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 0 rgba(232,201,138,0)}
    50%{box-shadow:0 0 26px 2px rgba(232,201,138,.18)}
  }
  @keyframes hintIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .enter-hint{animation:hintIn .8s .5s both,breathe 3.2s 1.3s ease-in-out infinite}

  body.leaving{opacity:0}
  body.leaving .cover-link img{transform:scale(1.03)}

  @media (prefers-reduced-motion:reduce){
    .cover-link img{transition:none}
    .enter-hint{animation:none}
  }
</style>
</head>
<body>
<div class="cover-bg" aria-hidden="true"></div>

<a class="cover-link" href="vr.html" aria-label="点击进入新本草 VR 图鉴">
  <img id="coverImg" src="assets/cover.jpg" alt="新本草：华农治愈图鉴——深秋限定「寻找专治大学生现代病的古方」">
</a>

<a class="enter-hint" href="vr.html"><b>点击画面</b> · 进入图鉴</a>

<script>
(function(){
  "use strict";
  var img = document.getElementById("coverImg");
  function ready(){ document.body.classList.add("ready"); }
  if(img.complete){ ready(); } else {
    img.addEventListener("load", ready);
    img.addEventListener("error", ready);
  }

  document.addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest('a[href="vr.html"]') : null;
    if(!a) return;
    if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    document.body.classList.add("leaving");
    setTimeout(function(){ location.href = "vr.html"; }, 320);
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      if(document.activeElement && document.activeElement.closest &&
         document.activeElement.closest('a[href="vr.html"]')){
        e.preventDefault();
        document.body.classList.add("leaving");
        setTimeout(function(){ location.href = "vr.html"; }, 320);
      }
    }
  });
})();
</script>
</body>
</html>
